name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Inject Firebase config from secret
        # The real config is kept out of git (.gitignore). It is restored here
        # from the FIREBASE_CONFIG_FILE secret so the deployed site works.
        env:
          FIREBASE_CONFIG_FILE: ${{ secrets.FIREBASE_CONFIG_FILE }}
        run: |
          if [ -z "$FIREBASE_CONFIG_FILE" ]; then
            echo "::error::Secret FIREBASE_CONFIG_FILE is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$FIREBASE_CONFIG_FILE" > js/firebase-config.js
          echo "firebase-config.js restored from secret"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4